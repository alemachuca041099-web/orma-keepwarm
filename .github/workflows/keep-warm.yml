name: keep-warm

# Render Free sleeps each service after 15 min without inbound traffic and needs ~80 s to
# come back. A plain */5 cron is both imprecise (GitHub delays scheduled runs) and expensive
# in runner minutes, so each run stays alive and pings in a loop from the inside.
on:
  schedule:
    # Window 05:00-23:00 CDMX == 11:00-05:00 UTC, in three 5h55 jobs so each one fits
    # under GitHub's 6 h per-job ceiling. The 5 min gap between jobs is well inside
    # Render's 15 min idle timer, so the CMS never sleeps mid-window.
    - cron: '0 11 * * *'
    - cron: '0 17 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Minutes the loop stays alive (0 = single test ping)'
        required: false
        default: '0'

concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Ping CMS every 5 minutes
        env:
          CMS: https://orma-cms-staging.onrender.com/_health
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MINUTES: ${{ inputs.minutes }}
        run: |
          set -u
          case "$SCHEDULE" in
            '0 11 * * *') MINUTES=355 ;;
            '0 17 * * *') MINUTES=355 ;;
            '0 23 * * *') MINUTES=355 ;;
            *) MINUTES="${INPUT_MINUTES:-0}" ;;
          esac
          ping() {
            result=$(curl -sS -o /dev/null -w '%{http_code} %{time_total}s' --max-time 120 "$1" || echo 'error')
            echo "$(date -u +%H:%M:%SZ) $2 -> $result"
          }
          echo "Loop budget: ${MINUTES} min"
          ping "$CMS" cms
          if [ "$MINUTES" -le 0 ]; then exit 0; fi
          END=$(( $(date +%s) + MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            sleep 300
            ping "$CMS" cms
          done
